# skillgen platform manifest
#
# Build-time only. Platforms restricted to Claude Code and Copilot (plus VS Code).

[platform.claude]
bucket = "split"
core = "core"
skill_dst = "graph_fy/skill.md"
refs_dst = "graph_fy/skills/claude/references"
description = "Use for any question about a codebase, its architecture, file relationships, or project content — especially when graph_fy_out/ exists, where the question should be treated as a graph_fy query first. Local AST and deterministic statistical graph algorithms with zero external calls."
dispatch = "agent-tool-disk"
extraction = "verbose"
shell = "posix"
claude_md = true

[platform.copilot]
bucket = "split"
core = "core"
skill_dst = "graph_fy/skill-copilot.md"
refs_dst = "graph_fy/skills/copilot/references"
description = "Use for any question about a codebase, its architecture, file relationships, or project content — especially when graph_fy_out/ exists, where the question should be treated as a graph_fy query first. Local AST and deterministic statistical graph algorithms with zero external calls."
dispatch = "agent-tool-disk"
extraction = "verbose"
